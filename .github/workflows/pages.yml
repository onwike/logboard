name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'JSON'
          {"build_type":"workflow"}
          JSON
          echo "workflow_source_exit:$?"
          gh api --method POST "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'JSON'
          {"build_type":"legacy","source":{"branch":"main","path":"/docs"}}
          JSON
          echo "legacy_source_exit:$?"
          gh api "repos/${{ github.repository }}/pages" || true
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
